<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#00205b">
<title>현장소통공간 · 모바일</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#00205b; --navy-700:#0a2f6e; --navy-50:#eef2fa;
  --org:#ff9e1b; --orgv:#ff7f32; --org-50:#fff4e2;
  --bg:#eef1f6; --card:#ffffff; --line:#e5e7eb; --line-2:#eef0f3;
  --ink:#1b2430; --ink-700:#3a424e; --muted:#73736d; --muted-2:#9498a1;
  --r:12px; --r-sm:9px; --r-lg:16px;
  --top-h:54px; --sub-h:52px; --nav-h:60px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  letter-spacing:-.01em; color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font-family:inherit;letter-spacing:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
mark{background:#ffe7ab;color:inherit;border-radius:3px;padding:0 1px;font-weight:700}
::-webkit-scrollbar{width:0;height:0}

/* ===== 상단바 ===== */
.m-top{
  position:sticky;top:0;z-index:40;height:var(--top-h);
  display:flex;align-items:center;justify-content:center;
  padding:0 14px;background:var(--navy);color:#fff;
}
.m-brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:16px;letter-spacing:-.02em}
.m-brand .heart{font-size:15px}
.m-brand .sub{font-size:11px;font-weight:600;opacity:.8;letter-spacing:.02em}

/* ===== 컨텍스트 서브바 ===== */
.m-sub{position:sticky;top:var(--top-h);z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);padding:9px 12px;min-height:var(--sub-h);
  display:flex;align-items:center;gap:8px}
.m-sub:empty{display:none}

/* 검색 입력 */
.m-search{display:flex;align-items:center;gap:8px;flex:1;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:0 8px 0 14px;height:42px;
  box-shadow:var(--shadow)}
.m-search:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-50)}
.m-search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.m-search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;
  color:var(--ink);min-width:0;height:100%}
.m-search input::placeholder{color:var(--muted-2)}
.m-search-clear{width:30px;height:30px;border:0;background:transparent;color:var(--muted);
  display:none;align-items:center;justify-content:center;flex-shrink:0}
.m-search-clear svg{width:14px;height:14px}
.m-search.has-val .m-search-clear{display:flex}

/* 세그먼트 토글 */
.m-seg{display:flex;background:#e3e7ee;border-radius:999px;padding:3px;gap:2px;flex:1}
.m-seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 4px;
  font-size:13.5px;font-weight:700;color:var(--muted)}
.m-seg button.on{background:var(--navy);color:#fff;box-shadow:var(--shadow)}

/* 카테고리 선택 셀렉터 (검색창과 구분되도록 라벨칩 + 아래 화살표) */
.m-filter{display:flex;align-items:center;gap:8px;background:var(--card);min-width:0;
  border:1px solid var(--line);border-radius:10px;padding:0 10px 0 9px;height:42px;
  box-shadow:var(--shadow);white-space:nowrap;max-width:64%}
.m-filter .fl-cat{flex-shrink:0;font-size:11px;font-weight:800;color:#fff;background:var(--navy);
  padding:4px 9px;border-radius:7px;letter-spacing:-.01em}
.m-filter .fl-txt{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink);text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-filter .fl-caret{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
.m-filter:active{background:var(--bg)}
.m-filter.flex1{flex:1;max-width:none}
.m-filter.noshrink{flex-shrink:0;max-width:55%}

/* ===== 본문 ===== */
.m-main{padding:12px 12px calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  min-height:60vh}
.m-stat{font-size:12px;color:var(--muted);font-weight:600;padding:2px 2px 10px}
.m-stat b{color:var(--navy);font-weight:800}

/* 접이식 섹션 */
.map-section{margin-bottom:12px}
.map-section-head{width:100%;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;text-align:left}
.map-section.open .map-section-head{border-bottom-left-radius:0;border-bottom-right-radius:0;
  border-bottom-color:var(--line-2)}
.map-section-arrow{display:flex;color:var(--muted);transition:transform .2s}
.map-section-arrow svg{width:15px;height:15px}
.map-section:not(.open) .map-section-arrow{transform:rotate(-90deg)}
.map-section-title{flex:1;font-size:14.5px;font-weight:800;color:var(--navy);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-section-count{font-size:11.5px;font-weight:700;color:var(--org);
  background:var(--org-50);padding:3px 9px;border-radius:999px}
.map-section-body{display:block;border:1px solid var(--line);border-top:0;
  border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r);
  padding:10px;background:#f7f8fb}
.map-section:not(.open) .map-section-body{display:none}
.prod-note{font-size:12px;color:var(--muted);padding:8px 11px;font-weight:600;background:var(--navy-50);
  border:1px solid #dbe4f4;border-radius:9px;margin-bottom:11px;line-height:1.5}

/* 단일 카테고리 결과(상품별·단일 업무) — 접이식 없이 깔끔한 제목 헤더 */
.solo-sec{margin-bottom:12px}
.solo-head{display:flex;align-items:center;gap:9px;padding:0 2px 12px;
  border-bottom:1px solid var(--line);margin-bottom:13px}
.solo-title{font-size:16.5px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.solo-cnt{font-size:11.5px;font-weight:700;color:var(--org);background:var(--org-50);padding:3px 10px;border-radius:999px}

.person-grid,.bs-grid{display:flex;flex-direction:column;gap:9px}

/* ===== 담당자 카드 ===== */
.person-card{position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 13px 12px;box-shadow:var(--shadow)}
.person-card.card-flash{animation:cardFlash 1.6s ease}
@keyframes cardFlash{0%,100%{box-shadow:var(--shadow)}
  15%{box-shadow:0 0 0 3px var(--org)}55%{box-shadow:0 0 0 3px rgba(255,158,27,.35)}}
.pc-fav{position:absolute;top:7px;right:7px;width:38px;height:38px;border:0;
  background:transparent;color:#cdd2da;display:flex;align-items:center;justify-content:center;
  border-radius:9px}
.pc-fav svg{width:20px;height:20px}
.pc-fav.on{color:var(--org)}
.pc-fav.on svg{fill:var(--org)}
.person-card-head{position:relative;display:flex;gap:11px;align-items:center;padding-right:34px}
.person-card.has-fn .person-card-head{padding-right:128px}
.person-avatar{width:44px;height:44px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
  background:var(--navy-50);color:var(--navy)}
.person-info-block{flex:1;min-width:0}
.person-primary-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.person-name-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 7px}
.person-name-main{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.person-id-inline{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.4}
.person-meta-inline{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
/* 업무분류 알약 — 카드 우측 세로 중앙, 즐겨찾기 별 왼쪽, 최대 2줄 */
.pc-fn{position:absolute;top:50%;right:46px;transform:translateY(-50%);max-width:76px;z-index:3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  white-space:normal;overflow-wrap:anywhere;word-break:keep-all;text-align:center;line-height:1.2;
  border:1px solid #ffd89a;background:var(--org-50);color:#a85d00;font-size:11px;font-weight:800;
  padding:4px 9px;border-radius:14px}
.pc-fn mark{background:var(--highlight,#ffe7ab);color:inherit;padding:0}
.person-work{margin-top:11px}
.person-work-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.person-work-list li{position:relative;padding-left:15px;font-size:13.5px;line-height:1.5;color:var(--ink-700)}
.person-work-list li::before{content:"";position:absolute;left:3px;top:9px;width:4px;height:4px;
  border-radius:50%;background:var(--org)}
.person-work-list li.work-sub-li{padding-left:26px;color:var(--muted);font-size:12.5px}
.person-work-list li.work-sub-li::before{content:"└";left:13px;top:0;width:auto;height:auto;
  background:transparent;color:#b9bec7;font-size:11px}
.person-alt{margin-top:11px;background:var(--navy-50);border:1px solid #dde6f5;border-radius:var(--r-sm);
  padding:8px 11px;display:flex;gap:9px;align-items:flex-start}
.person-alt-label{flex-shrink:0;font-size:10.5px;font-weight:800;color:#fff;background:var(--navy);
  padding:3px 8px;border-radius:999px;margin-top:1px}
.person-alt-body{flex:1;font-size:12.5px;color:var(--ink-700);line-height:1.55}
.alt-line{display:block}
.person-alt-jump{border:0;background:transparent;color:var(--navy);font-weight:800;
  font-size:12.5px;padding:0;text-decoration:underline;text-underline-offset:2px}
.alt-name-plain{font-weight:700}
.alt-ctx{color:var(--muted)}

/* 연락처(접이식 — 기본 접힘, v 누르면 펼침) */
.mc{margin-top:11px}
.mc-toggle{width:100%;display:flex;align-items:center;gap:7px;background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--ink-700)}
.mc-toggle>svg:first-child{width:14px;height:14px;color:var(--muted);flex-shrink:0}
.mc-toggle>span{flex:1;text-align:left}
.mc-toggle .mc-tg-ic{width:15px;height:15px;color:var(--muted);transition:transform .2s}
.mc.open .mc-toggle{background:var(--navy-50);color:var(--navy);border-color:#dbe4f4;
  border-bottom-left-radius:0;border-bottom-right-radius:0}
.mc.open .mc-toggle .mc-tg-ic{transform:rotate(180deg)}
.mc-body{display:none;border:1px solid #dbe4f4;border-top:0;border-radius:0 0 9px 9px;padding:2px 12px}
.mc.open .mc-body{display:block}
.mc-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.mc-row:last-child{border-bottom:0}
.mc-lbl{font-size:11.5px;color:var(--muted-2);font-weight:700;width:30px;flex-shrink:0}
.mc-val{flex:1;min-width:0;font-size:13.5px;color:var(--ink);font-weight:600;
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 행 액션 버튼(전화걸기/메일보내기) — 같은 폭으로 통일, 글자 짤림은 값 쪽에서만 */
.mc-actbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex-shrink:0;
  min-width:98px;height:34px;padding:0 12px;background:var(--navy);color:#fff;border-radius:8px;
  font-size:12.5px;font-weight:800;letter-spacing:-.01em}
.mc-actbtn svg{width:13px;height:13px}
.mc-callbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:var(--navy);
  color:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:800;flex-shrink:0}
.mc-callbtn svg{width:13px;height:13px}
.mc-callbtn-full{display:flex;width:100%;height:40px}

/* ===== 보상서포터즈 카드 ===== */
.bs-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;box-shadow:var(--shadow)}
.bs-card-cat{display:inline-block;font-size:11px;font-weight:800;color:var(--navy);
  background:var(--navy-50);padding:3px 9px;border-radius:999px;margin-bottom:8px}
.bs-card-name{font-size:15.5px;font-weight:800;color:var(--ink)}
.bs-card-pos{font-size:12px;font-weight:600;color:var(--muted)}
.bs-card-dept{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.bs-card-contact{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
  display:flex;flex-direction:column;gap:1px}

/* ===== 빈 상태 ===== */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-ic{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#c4c9d2}
.empty-ic svg{width:24px;height:24px}
.empty-title{font-size:15px;font-weight:800;color:var(--ink-700)}
.empty-hint{font-size:12.5px;margin-top:6px}
.empty-hint b{color:var(--navy)}

/* ===== 검색 홈(유휴) ===== */
.q-hero{text-align:center;padding:26px 8px 18px}
.q-hero-mark{font-size:24px;font-weight:900;color:var(--navy);letter-spacing:-.03em}
.q-hero-mark .o{color:var(--org)}
.q-hero-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:9px;line-height:1.5}
.q-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;justify-content:center}
.q-chip{border:1px solid var(--line);background:var(--card);color:var(--ink-700);
  border-radius:999px;padding:9px 15px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.q-chip .x{color:var(--muted-2);margin-left:5px;font-weight:800}
.q-sec-label{font-size:11.5px;font-weight:800;color:var(--muted-2);letter-spacing:.03em;
  margin:24px 4px 11px;display:flex;align-items:center;gap:7px}
.q-sec-label .ln{flex:1;height:1px;background:var(--line)}
.q-sec-cnt{color:var(--org);background:var(--org-50);padding:2px 8px;border-radius:999px}

/* 알림 배너 */
.m-notice{display:flex;gap:9px;background:var(--navy-50);border:1px solid #dbe4f4;
  border-radius:var(--r);padding:11px 12px;margin-bottom:13px}
.m-notice svg{width:17px;height:17px;color:var(--navy);flex-shrink:0;margin-top:1px}
.m-notice-txt{font-size:12px;color:var(--ink-700);line-height:1.55}
.m-notice-txt b{color:var(--navy);font-weight:800}

/* ===== 현장소통담당 보드 ===== */
.fc-cat{margin-bottom:14px}
.fc-cat-head{display:flex;align-items:center;gap:8px;padding:0 2px 9px}
.fc-cat-head .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--navy)}
.fc-cat-head .ic svg{width:17px;height:17px}
.fc-cat-title{font-size:15px;font-weight:800;color:var(--navy)}
.fc-cat-cnt{font-size:11px;font-weight:700;color:var(--org);background:var(--org-50);
  padding:2px 8px;border-radius:999px}
.fc-mem{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;box-shadow:var(--shadow);margin-bottom:8px}
.fc-mem.link{cursor:pointer}
.fc-mem.link:active{background:var(--navy-50)}
.fc-av{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;color:var(--navy)}
.fc-mem-meta{flex:1;min-width:0}
.fc-mem-name{font-size:15px;font-weight:800;color:var(--ink)}
.fc-mem-name .rk{font-size:12px;font-weight:600;color:var(--muted);margin-left:5px}
.fc-mem-dept{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
.fc-mem-go{flex-shrink:0;color:var(--muted-2)}
.fc-mem-go svg{width:17px;height:17px}

/* ===== 하단 네비 ===== */
.m-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);
  display:flex;box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.m-nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:var(--muted-2);font-size:10.5px;font-weight:700;
  position:relative;padding-top:6px}
.m-nav button svg{width:22px;height:22px;stroke-width:2}
.m-nav button.on{color:var(--navy)}
.m-nav button.on .ni{color:var(--org)}
.m-nav .ni{display:flex;color:var(--muted-2)}
.m-nav .nav-badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;
  padding:0 4px;border-radius:999px;background:var(--orgv);color:#fff;font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;line-height:1}

/* ===== 드로어(필터) ===== */
.m-scrim{position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.45);opacity:0;
  visibility:hidden;transition:opacity .25s}
.m-scrim.show{opacity:1;visibility:visible}
.m-drawer{position:fixed;top:0;bottom:0;left:0;z-index:61;width:84%;max-width:340px;
  background:var(--bg);transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.m-drawer.show{transform:translateX(0)}
.m-drawer-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;
  background:var(--navy);color:#fff;flex-shrink:0}
.m-drawer-title{font-size:15px;font-weight:800}
.m-drawer-close{width:34px;height:34px;border:0;background:rgba(255,255,255,.15);border-radius:9px;
  color:#fff;display:flex;align-items:center;justify-content:center}
.m-drawer-close svg{width:16px;height:16px}
.m-drawer-body{flex:1;overflow-y:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 16px)}
.d-cap{font-size:11px;font-weight:800;color:var(--muted-2);letter-spacing:.03em;padding:10px 6px 7px;
  display:flex;justify-content:space-between}
.d-item{width:100%;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px 13px;margin-bottom:6px;text-align:left;font-size:14px;font-weight:700;color:var(--ink-700)}
.d-item.on{border-color:var(--navy);background:var(--navy-50);color:var(--navy)}
.d-item .d-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-item .d-cnt{font-size:11.5px;font-weight:700;color:var(--muted-2);background:var(--bg);
  padding:2px 8px;border-radius:999px}
.d-item.on .d-cnt{color:var(--navy);background:#fff}
.d-pin{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#cdd2da;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.d-pin svg{width:15px;height:15px}
.d-pin.on{color:var(--org)}.d-pin.on svg{fill:var(--org)}

</div>

<div class="m-toast" id="m-toast"></div>

<script>
// ===== 공통 유틸 =====
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
function toChosung(text) {
  let out = "";
  for (const c of String(text || "")) {
    const cp = c.charCodeAt(0);
    if (cp >= 0xAC00 && cp <= 0xD7A3) out += CHO[Math.floor((cp - 0xAC00) / 588)];
    else if (c === " ") out += " ";
    else out += c.toLowerCase();
  }
  return out;
}

// 참조 지식(지식맵·Q&A·용어사전)의 담당자·작성자 — 인사이동 가능성 안내
const STALE_NOTE = `<span class="ref-stale"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>작성 시점 기준이므로 현재와 다를 수 있습니다. 참고용으로 활용하세요.</span>`;

// 검색 유사어 — 현장 총무 업무 맥락에 맞춰 확장
// 키와 값 어느 쪽으로 검색해도 그룹 내 모든 단어로 매칭됨 (양방향)
const SYNONYMS = {
  // 보험 계약 라이프사이클
  "청약":   ["가입", "신계약"],
  "변경":   ["계약변경", "정정"],
  "갱신":   ["자동갱신", "재계약"],
  "해지":   ["해약", "중도해지"],
  "취소":   ["철회", "취소철회"],
  "부활":   ["복원"],
  // 수납/입금
  "납입":   ["보험료", "수납"],
  "이체":   ["자동이체", "CMS"],
  "환불":   ["환급", "반환"],
  "입금":   ["납부", "수납"],
  // 보험금/사고
  "사고":   ["사고접수", "보상", "보험금청구"],
  "보험금": ["지급", "수익자"],
  "구상":   ["구상권", "환수"],
  // 상품/담보
  "실손":   ["실비", "실손의료비"],
  "담보":   ["보장", "특약"],
  "면책":   ["면책기간", "면책사유"],
  "할인":   ["할인할증"],
  // 자동차
  "자동차": ["자보", "차보험"],
  "대물":   ["대물배상"],
  "대인":   ["대인배상"],
  "자차":   ["자기차량손해"],
  // 일반/장기 구분
  "장기":   ["장기보험"],
  "일반":   ["일반보험"],
  "단체":   ["단체보험"],
  // 심사/인수
  "인수":   ["언더라이팅", "UW"],
  "심사":   ["언더라이팅"],
  "고지":   ["고지의무", "알릴의무"],
  // 문서/업무
  "공문":   ["접수공문"],
  "결재":   ["전결", "전결규정"],
  "보고서": ["리포트"],
  "지침":   ["가이드", "매뉴얼", "가이드라인"],
  "규정":   ["내규"],
  // 시스템/도구
  "지식센터": ["하이미", "Himi", "KMS"],
  "전산":   ["시스템"],
};
const SYN_MAP = (() => {
  const m = new Map();
  for (const [k, vs] of Object.entries(SYNONYMS)) {
    const g = [k, ...vs].map(s => s.toLowerCase());
    for (const w of g) {
      if (!m.has(w)) m.set(w, new Set());
      g.forEach(x => m.get(w).add(x));
    }
  }
  return m;
})();

function expandTerm(t) {
  const l = t.toLowerCase();
  return SYN_MAP.has(l) ? [...SYN_MAP.get(l)] : [l];
}

// 0건 시 역방향 제안 — 입력 단어와 유사한 다른 단어 추천
// 예: "차보험" 검색 → 결과 0건 → ["자동차", "자보"] 제안
function suggestAlternatives(query) {
  if (!query) return [];
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  const sugg = new Set();
  for (const w of words) {
    if (SYN_MAP.has(w)) {
      SYN_MAP.get(w).forEach(s => { if (s !== w) sugg.add(s); });
    }
  }
  return [...sugg].slice(0, 5);
}

// 통합 점수 — 텍스트 매칭 + 메타 가산점(조회수·최신성)
// opts: { views?:number, date?:string('YYYY-MM-DD') }
function searchScore(haystack, q, opts) {
  let s = 0;
  for (const term of q) {
    if (!term) continue;
    if (haystack.startsWith(term)) s += 5;
    else if (haystack.indexOf(" " + term) !== -1) s += 3;
    else if (haystack.indexOf(term) !== -1) s += 1;
  }
  if (opts) {
    // 조회수 가산점: log10 스케일 (1만회 = +4점, 1천회 = +3점)
    if (opts.views && opts.views > 0) s += Math.min(5, Math.log10(opts.views + 1));
    // 최신성 가산점: 1년 이내 +2, 2년 이내 +1
    if (opts.date) {
      const y = parseInt(opts.date.slice(0, 4), 10);
      const m = parseInt(opts.date.slice(5, 7) || "1", 10);
      if (y > 0) {
        const ageY = (new Date().getFullYear() - y) + (new Date().getMonth() + 1 - m) / 12;
        if (ageY <= 1) s += 2;
        else if (ageY <= 2) s += 1;
      }
    }
  }
  return s;
}

// 검색 옵션 — localStorage 기반, 사용자가 끄고 켤 수 있는 동작 토글
// 통합검색 페이지의 ⚙ 검색 옵션 버튼에서 변경
const SEARCH_OPTS_KEY = "chongmu_search_opts_v1";
const SEARCH_OPTS_DEFAULT = {
  synonyms:    true,  // 유사어 자동 확장
  chosung:     true,  // 자모만 입력 시 초성 검색
  recentBoost: true,  // 최신 자료 가산점
  popularBoost: true, // 조회수 가산점
  scope: {            // 검색 카테고리 범위
    files:    true,
    people:   true,
    faq:      true,
    glossary: true,
    docs:     true,
  },
};
const searchOptions = {
  _cache: null,
  get() {
    if (this._cache) return this._cache;
    try {
      const raw = localStorage.getItem(SEARCH_OPTS_KEY);
      const saved = raw ? JSON.parse(raw) : {};
      this._cache = {
        ...SEARCH_OPTS_DEFAULT,
        ...saved,
        scope: { ...SEARCH_OPTS_DEFAULT.scope, ...(saved.scope || {}) },
      };
    } catch (e) { this._cache = { ...SEARCH_OPTS_DEFAULT, scope: { ...SEARCH_OPTS_DEFAULT.scope } }; }
    return this._cache;
  },
  set(patch) {
    const next = { ...this.get(), ...patch };
    if (patch.scope) next.scope = { ...this.get().scope, ...patch.scope };
    this._cache = next;
    try { localStorage.setItem(SEARCH_OPTS_KEY, JSON.stringify(next)); } catch (e) {}
  },
  reset() {
    this._cache = null;
    try { localStorage.removeItem(SEARCH_OPTS_KEY); } catch (e) {}
  },
  isDefault() {
    const cur = this.get();
    const dflt = SEARCH_OPTS_DEFAULT;
    return cur.synonyms === dflt.synonyms && cur.chosung === dflt.chosung &&
           cur.recentBoost === dflt.recentBoost && cur.popularBoost === dflt.popularBoost &&
           Object.keys(dflt.scope).every(k => cur.scope[k] === dflt.scope[k]);
  },
};

// 검색어 히스토리 — localStorage 기반, 최근 6개
const SEARCH_HISTORY_KEY = "chongmu_search_history_v1";
const SEARCH_HISTORY_MAX = 6;
const searchHistory = {
  get() {
    try {
      const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  },
  add(q) {
    const norm = (q || "").trim();
    if (!norm || norm.length < 2) return;
    let list = this.get().filter(x => x !== norm);
    list.unshift(norm);
    if (list.length > SEARCH_HISTORY_MAX) list = list.slice(0, SEARCH_HISTORY_MAX);
    try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
  },
  remove(q) {
    const list = this.get().filter(x => x !== q);
    try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
  },
  clear() {
    try { localStorage.removeItem(SEARCH_HISTORY_KEY); } catch (e) {}
  },
};

function isChosungQuery(q) {
  // 자모 1개만 있을 때는 초성 검색 안 함 (결과가 너무 광범위해짐)
  if (q.replace(/\s/g, "").length < 2) return false;
  return q.length > 0 && /^[\u3131-\u314Ea-z0-9\s]+$/i.test(q) && /[\u3131-\u314E]/.test(q);
}

// IME 조합 + 디바운스를 묶은 통합 input 헬퍼
function setupSearchInput(input, clearBtn, onChange, opts) {
  opts = opts || {};
  const delay = opts.delay || 180;
  let composing = false;
  let timer = null;

  function trigger() {
    clearTimeout(timer);
    timer = setTimeout(function() {
      if (composing) return;
      onChange();
    }, delay);
  }

  input.addEventListener("compositionstart", function() {
    composing = true;
    clearTimeout(timer);
  });
  input.addEventListener("compositionend", function() {
    composing = false;
    trigger();
  });
  input.addEventListener("input", function() {
    if (composing) return;
    trigger();
  });

  if (clearBtn) {
    clearBtn.addEventListener("click", function() {
      input.value = "";
      input.focus();
      clearTimeout(timer);
      onChange();
    });
  }
}

function parseQuery(q) {
  const isCho = isChosungQuery(q);
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const expanded = terms.map(t => isCho ? [t] : [...new Set(expandTerm(t))]);
  return { terms, expanded, isChosung: isCho };
}

function matches(haystack, expanded) {
  if (expanded.length === 0) return true;
  if (!haystack) return false;
  return expanded.every(g => g.some(t => haystack.indexOf(t) !== -1));
}

// 검색 결과 클릭 후 대상 요소 노란색 플래시 (qa-hl 애니메이션 재사용)
window.__flashEl = function(el) {
  if (!el) return;
  el.classList.remove('qa-hl');
  void el.offsetWidth;
  el.classList.add('qa-hl');
  setTimeout(function() { el.classList.remove('qa-hl'); }, 2600);
};

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function highlight(text, terms) {
  const esc = escapeHtml(text);
  if (!terms || terms.length === 0) return esc;
  const all = [];
  terms.forEach(g => g.forEach(t => all.push(t)));
  if (all.length === 0) return esc;
  all.sort((a, b) => b.length - a.length);
  try {
    const re = new RegExp("(" + all.map(escapeRegex).join("|") + ")", "gi");
    return esc.replace(re, "<mark>$1</mark>");
  } catch (e) { return esc; }
}

function initials(name) {
  const s = (name || "").trim();
  if (!s) return "";
  return s.length <= 2 ? s : s.slice(0, 2);
}

// IME (한글 입력 조합) 추적 — 글로벌
let __composing = false;
document.addEventListener("compositionstart", (e) => {
  if (e.target && e.target.matches && e.target.matches('input[type="search"]')) {
    __composing = true;
  }
}, true);
document.addEventListener("compositionend", (e) => {
  if (e.target && e.target.matches && e.target.matches('input[type="search"]')) {
    __composing = false;
    // 조합 완료 시점에 검색 한 번 실행
    e.target.dispatchEvent(new Event("input"));
  }
}, true);

// 디바운스 — IME 조합 중에는 실행 안 함
function debounce(fn, ms) {
  let t;
  return function(...args) {
    clearTimeout(t);
    if (__composing) return;
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

// 검색어 정규화 — 1글자 자음 단독은 검색하지 않음 (노이즈 차단)
function normalizeQuery(s) {
  s = (s || "").trim();
  if (s.length === 1 && /^[\u3131-\u314E]$/.test(s)) return "";
  return s;

// ── 대행자 이름 → 담당자(사번) 해석 & 카드 점프 ──
var NAME2P = {}, EMP2P = {};
DATA.people.forEach(function(p){
  (NAME2P[p.n] = NAME2P[p.n] || []).push(p);
  if (p.empNo != null && p.empNo !== "") EMP2P[String(p.empNo)] = p;
});
// 동명이인은 참조한 담당자와 같은 부서(d) → 같은 그룹(grp) 순으로 특정
function resolveAltPerson(name, owner){
  var cands = NAME2P[name]; if (!cands || !cands.length) return null;
  if (cands.length === 1) return cands[0];
  var byD = cands.filter(function(c){ return owner && c.d === owner.d; }); if (byD.length) return byD[0];
  var byG = cands.filter(function(c){ return owner && c.grp === owner.grp; }); if (byG.length) return byG[0];
  return cands[0];
}
// 괄호 밖 텍스트에서 등록된 담당자 이름만 탐욕적으로(긴 이름 우선) 추출
function scanAltNames(text){
  var segs = [], i = 0, buf = "";
  while (i < text.length){
    var hit = null;
    for (var L = 4; L >= 2; L--){ var c = text.substr(i, L); if (c.length === L && NAME2P[c]){ hit = c; break; } }
    if (hit){ if (buf){ segs.push({ text: buf }); buf = ""; } segs.push({ name: hit }); i += hit.length; }
    else { buf += text.charAt(i); i++; }
  }
  if (buf) segs.push({ text: buf });
  return segs;
}
// 대행자 문자열을 줄/괄호 구조 유지하며 세그먼트화 (괄호 안 지역·채널은 이름 탐색 제외)
function altSegments(a){
  return String(a || "").split("\n").map(function(line){
    var out = [], re = /\(([^)]*)\)/g, last = 0, m;
    while ((m = re.exec(line))){
      if (m.index > last) out = out.concat(scanAltNames(line.slice(last, m.index)));
      out.push({ text: m[0] });
      last = re.lastIndex;
    }
    if (last < line.length) out = out.concat(scanAltNames(line.slice(last)));
    return out;
  });
}
function altNamesStr(p){
  var names = [];
  altSegments(p.a).forEach(function(line){ line.forEach(function(s){ if (s.name) names.push(s.name); }); });
  return names.join(" ");
}
var ALT_ARR = '';
function altBodyHtml(p){
  function seg(s){
    if (s.name){
      var person = resolveAltPerson(s.name, p);
      if (person && person.empNo != null && person.empNo !== "")
        return '<button type="button" class="person-alt-jump" data-jump-emp="' + escapeHtml(String(person.empNo)) + '" title="' + escapeHtml(s.name) + ' 위치로 이동">' + escapeHtml(s.name) + ALT_ARR + '</button>';
      return '<span class="alt-name-plain">' + escapeHtml(s.name) + '</span>';
    }
    var t = (s.text || '').trim();
    return t ? '<span class="alt-ctx">' + escapeHtml(t) + '</span>' : '';
  }
  // 이름 없는 줄(직급·지역 등)은 직전 이름 줄에 이어붙여 "이름+직급+지역"을 한 행으로 묶음
  var rows = [];
  altSegments(p.a).forEach(function(line){
    var hasName = line.some(function(s){ return s.name; });
    var inner = line.map(seg).join('');
    if (!inner) return;
    if (!hasName && rows.length) rows[rows.length - 1] += inner;
    else rows.push(inner);
  });
  return rows.map(function(r){ return '<div class="alt-line">' + r + '</div>'; }).join('');
}
// 대행자 클릭 → 해당 담당자 카드로 이동: 현재 화면에 보이면 스크롤+강조, 없으면 통합검색으로 폴백
function flashCard(card){ if(!card) return; card.classList.remove('card-flash'); void card.offsetWidth; card.classList.add('card-flash'); setTimeout(function(){ card.classList.remove('card-flash'); }, 1700); }
function jumpToEmp(emp){
  if (!emp) return;
  var cards = document.querySelectorAll('.person-card[data-emp="' + emp + '"]');
  var vis = null;
  Array.prototype.forEach.call(cards, function(c){ if (!vis && c.offsetParent !== null) vis = c; });
  if (vis){ vis.scrollIntoView({ behavior: 'smooth', block: 'center' }); flashCard(vis); return; }
  var person = EMP2P[String(emp)];
  var stab = document.querySelector('.topbar .tab[data-target="search"]'); if (stab) stab.click();
  var qi = $id('q-search'), qf = $id('q-form');
  if (qi && qf && person){
    qi.value = person.n;
    qf.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
    var t = document.querySelector('#q-results .person-card[data-emp="' + emp + '"]');
    if (t){ t.scrollIntoView({ behavior: 'smooth', block: 'center' }); flashCard(t); }
  }
}

DATA.people.forEach(p => {
  p._s = (p.n + " " + p.d + " " + (p.sd || "") + " " + p.w + " " + (p.empNo || "") + " " + altNamesStr(p)).toLowerCase();
  p._cs = toChosung(p.n + " " + p.w);
  // 업무 키워드 토큰화 (업무별 보기용)
  p._tokens = (p.w || "").split(/[/,，、()（）\s└-]+/).filter(t => t && t.length >= 2 && t.length <= 8);
});

var FAV = (function(){
  var KEY = 'finder_favs_v1';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch(e){ return []; } }
  function save(a){ try { localStorage.setItem(KEY, JSON.stringify(a)); } catch(e){} }
  var ids = load().map(String);
  return {
    has: function(id){ return ids.indexOf(String(id)) >= 0; },
    toggle: function(id){ id = String(id); var i = ids.indexOf(id); if(i >= 0) ids.splice(i,1); else ids.unshift(id); save(ids); return ids.indexOf(id) >= 0; },
    list: function(){ return ids.slice(); },
    setOrder: function(arr){ ids = arr.map(String); save(ids); }
  };
})();

function regionTokenMatch(text, kws){
  var toks = String(text||'').split(/[\s\(\),·\/\-]+/).filter(Boolean).map(function(t){ return t.toLowerCase(); });
  return kws.some(function(kw){ var lk = kw.toLowerCase(); return toks.some(function(t){ return t.indexOf(lk) === 0; }); });
}
function fmtWork(w, exp){
  if (!w) return '<div class="person-work"></div>';
  // 줄바꿈이 있으면 줄 단위로, 없으면 레거시 ' - ' 구분자로 분리
  var lines = (w.indexOf('\n') >= 0) ? w.split(/\n/) : w.split(/\s*-\s+/);
  // 각 줄을 최상위(-) / 하위(└) 항목으로 정규화
  var items = lines.map(function(raw){
    var t = String(raw).replace(/\s+$/, '').replace(/^\s+/, '');
    if (!t) return null;
    if (t.charAt(0) === '└') return { sub: true, text: t.replace(/^└\s*/, '').trim() };
    return { sub: false, text: t.replace(/^[-\s]+/, '').trim() };
  }).filter(function(i){ return i && i.text; });
  if (!items.length) return '';
  // 단일 항목도 일관되게 불릿(•) 리스트로 렌더링
  return '<div class="person-work"><ul class="person-work-list">'
    + items.map(function(i){
        return i.sub
          ? '<li class="work-sub-li">' + highlight(i.text, exp) + '</li>'
          : '<li>' + highlight(i.text, exp) + '</li>';
      }).join('')
    + '</ul></div>';
}

  bosangSel(); // 선택 지역 기본값 보정(콘텐츠 제목에 표시). 지역 목록은 좌측 핸들로 연다.
  el('m-sub').innerHTML='<div class="m-search'+(M.bosang.q?' has-val':'')+'" id="m-bs-wrap" style="flex:1;min-width:0">'+I.search
    +'<input id="m-bs-q" type="search" enterkeyhint="search" placeholder="지역·담당자·부서" autocomplete="off" spellcheck="false">'
    +'<button class="m-search-clear" id="m-bs-clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>';
  var qi=el('m-bs-q');qi.value=M.bosang.q||'';
  setupSearchInput(qi,el('m-bs-clear'),function(){M.bosang.q=qi.value;el('m-bs-wrap').classList.toggle('has-val',!!qi.value);bosangRender();});
}
function bosangRender(){
  var c=el('m-content'),q=normalizeQuery(M.bosang.q||'');
  if(q){
    var pq=parseQuery(q),order=[],byR={};
    bosangData().forEach(function(o){o.cats.forEach(function(cc){
      var hay=(o.region+' '+o.gubun+' '+cc.cat+' '+cc.dept+' '+cc.name).toLowerCase();
      if(matches(hay,pq.expanded)){if(!byR[o.region]){byR[o.region]={gubun:o.gubun,items:[]};order.push(o.region);}byR[o.region].items.push(cc);}});});
    if(!order.length){c.innerHTML=emptyHtml('검색 결과가 없습니다','');return;}
    var html='';order.forEach(function(r){html+=mapSectionHtml(r,esc(BS_GLABEL[byR[r].gubun]||byR[r].gubun),byR[r].items.map(function(x){return bsCatCard(x);}).join(''),'bs-grid');});
    c.innerHTML=html;bindMapSectionToggle(c);return;
  }
  var sel=bosangSel(),o=null;bosangData().forEach(function(x){if(x.region===sel)o=x;});
  if(!o){c.innerHTML=emptyHtml('지역을 선택하세요','');return;}
  c.innerHTML=mapSectionHtml(o.region,esc(BS_GLABEL[o.gubun]||o.gubun),o.cats.map(function(x){return bsCatCard(x);}).join(''),'bs-grid');
  }
function bosangDrawer(){
  var d=bosangData(),sel=bosangSel();
  var pins=loadPins(BS_PIN).filter(function(rn){return d.some(function(o){return o.region===rn;});});
  var pinSet={};pins.forEach(function(r){pinSet[r]=1;});
  var groups={};d.forEach(function(o){(groups[o.gubun]=groups[o.gubun]||[]).push(o);});
  var h='<div class="d-cap"><span>보상서포터즈</span><span>'+d.length+'개 지역</span></div>';
  function item(o){var on=pinSet[o.region];
    return '<button class="d-item'+(o.region===sel?' on':'')+'" data-bsregion="'+esc(o.region)+'"><span class="d-name">'+esc(o.region)+'</span>'
      +'<span class="d-pin'+(on?' on':'')+'" data-bspin="'+esc(o.region)+'" role="button" aria-label="고정">'+I.pin+'</span></button>';}
  if(pins.length){var pobjs=pins.map(function(rn){var f=null;d.forEach(function(o){if(o.region===rn)f=o;});return f;}).filter(Boolean);
    h+='<div class="d-sec">'+I.pin+'<span>고정</span></div>'+pobjs.map(item).join('')+'<div class="d-divider"></div>';}
  BS_GORDER.forEach(function(g){var list=(groups[g]||[]).filter(function(o){return !pinSet[o.region];});if(!list.length)return;
    var open=d.length&&((sel&&list.some(function(o){return o.region===sel;}))||(!pins.length&&g===BS_GORDER[0]));
    h+='<div class="d-grp'+(open?' open':'')+'" data-grp="'+esc(g)+'"><button class="d-grp-hd" data-grptoggle="'+esc(g)+'"><span class="arr">'+I.chevR+'</span><span>'+esc(BS_GLABEL[g]||g)+'</span><span class="d-grp-cnt">'+list.length+'</span></button><div class="d-grp-body"><div class="d-grp-inner">';
    list.forEach(function(o){h+=item(o);});h+='</div></div></div>';});
  return {title:'보상서포터즈',body:h,after:syncDrawerAccordion};
}

// ====================================================================
// 뷰: 현장소통담당
// ====================================================================
function fieldcomSub(){el('m-sub').innerHTML='';}
function fieldcomRender(){
  var html='<div class="m-notice">'+I.info+'<div class="m-notice-txt"><b>현업 담당자를 찾기 어려울 때</b>, 보종별 현장 소통 담당자에게 바로 문의하세요. 카드를 누르면 담당 업무로 이동합니다.</div></div>';
  FC_BOARD.forEach(function(cat){
    html+='<div class="fc-cat"><div class="fc-cat-head"><span class="ic" style="background:'+cat.bg+'">'+cat.icon+'</span>'
      +'<span class="fc-cat-title">'+esc(cat.cat)+'</span><span class="fc-cat-cnt">'+cat.members.length+'</span></div>';
    cat.members.forEach(function(m){
      var p=fcIdx[m.n+'|'+m.d];var link=p&&p.area;
      html+='<div class="fc-mem'+(link?' link':'')+'"'+(link?' data-fcjump="'+esc(p.empNo)+'" data-fcarea="'+esc(p.area)+'" data-fcu="'+esc(p.u||'')+'"':'')+'>'
        +'<span class="fc-av" style="background:'+cat.bg+'">'+esc(m.n.charAt(0))+'</span>'
        +'<span class="fc-mem-meta"><span class="fc-mem-name">'+esc(m.n)+'<span class="rk">'+esc(m.rk)+'</span></span><span class="fc-mem-dept">'+esc(m.d)+'</span></span>'
        +(link?'<span class="fc-mem-go">'+I.chevR+'</span>':'')+'</div>';});
    html+='</div>';
  });
  el('m-content').innerHTML=html;
}

// ====================================================================
// 뷰: 즐겨찾기
// ====================================================================
function favoritesSub(){el('m-sub').innerHTML='';}
function favoritesRender(){
  var ppl=FAV.list().map(function(id){return empIdx[String(id)];}).filter(Boolean);
  var c=el('m-content');
  var notice='<div class="m-notice">'+I.info+'<div class="m-notice-txt"><b>즐겨찾기는 이 기기·브라우저에만 저장됩니다.</b> 다른 기기에서는 보이지 않으며 브라우저 데이터 삭제 시 초기화됩니다.</div></div>';
  if(!ppl.length){c.innerHTML=notice+emptyHtml('즐겨찾기가 비어 있습니다','담당자 카드의 <b>★</b>를 누르면 여기에 모입니다');return;}
  c.innerHTML=notice+'<div class="m-stat"><b>'+ppl.length+'</b>명</div><div class="person-grid">'+ppl.map(function(p){return personCardHtml(p,[]);}).join('')+'</div>';
}

// ── 뷰 레지스트리 ──
var VIEWS={
  search:{sub:searchSub,render:searchRender,drawer:null},
  dept:{sub:deptSub,render:deptRender,drawer:deptDrawer},
  area:{sub:areaSub,render:areaRender,drawer:areaDrawer},
  region:{sub:regionSub,render:regionRender,drawer:regionDrawer},
  bosang:{sub:bosangSub,render:bosangRender,drawer:bosangDrawer},
  fieldcom:{sub:fieldcomSub,render:fieldcomRender,drawer:null},
  favorites:{sub:favoritesSub,render:favoritesRender,drawer:null}
};

// ====================================================================
// 드로어 / 시트
// ====================================================================
function syncDrawerAccordion(){
  el('m-drawer-body').querySelectorAll('.d-grp').forEach(function(g){
    var body=g.querySelector('.d-grp-body');if(body)body.style.maxHeight=g.classList.contains('open')?(body.scrollHeight+'px'):'0px';});
}
function openDrawer(){
  var v=VIEWS[M.view];if(!v||!v.drawer)return;
  var d=v.drawer();
  el('m-drawer-title').textContent=d.title;
  el('m-drawer-body').innerHTML=d.body;
  el('m-drawer').classList.add('show');el('m-scrim').classList.add('show');
  document.body.style.overflow='hidden';
  if(d.after)d.after();
}
function closeDrawer(){el('m-drawer').classList.remove('show');if(!el('m-sheet').classList.contains('show')){el('m-scrim').classList.remove('show');document.body.style.overflow='';}}
function openSheet(){
  el('m-sheet-body').innerHTML=MORE.map(function(m){
    return '<button class="sheet-item'+(M.view===m.id?' on':'')+'" data-more="'+m.id+'"><span class="si-ic">'+m.icon+'</span>'
      +'<span class="si-tx"><span class="si-name">'+esc(m.label)+'</span><span class="si-desc">'+esc(m.desc)+'</span></span>'
      +'<span class="si-go">'+I.chevR+'</span></button>';}).join('');
  el('m-sheet').classList.add('show');el('m-scrim').classList.add('show');document.body.style.overflow='hidden';
}
function closeSheet(){el('m-sheet').classList.remove('show');if(!el('m-drawer').classList.contains('show')){el('m-scrim').classList.remove('show');document.body.style.overflow='';}}

// ====================================================================
// 이벤트 위임
// ====================================================================
el('m-nav').addEventListener('click',function(e){
  var b=e.target.closest('[data-nav]');if(!b)return;var id=b.dataset.nav;
  if(id==='more'){openSheet();return;}go(id);
});
el('m-sheet-body').addEventListener('click',function(e){var b=e.target.closest('[data-more]');if(!b)return;go(b.dataset.more);});
el('m-scrim').addEventListener('click',function(){closeDrawer();closeSheet();});
el('m-drawer-close').addEventListener('click',closeDrawer);
el('m-edge').addEventListener('click',openDrawer);

// 서브바(필터 버튼·세그먼트) 위임
el('m-sub').addEventListener('click',function(e){
  if(e.target.closest('#m-filter-btn')){openDrawer();return;}
  var ap=e.target.closest('[data-apanel]');if(ap){M.area_panel=ap.dataset.apanel;M.area.u=null;areaSub();areaRender();updateEdge();window.scrollTo(0,0);return;}
  var rm=e.target.closest('[data-rmode]');if(rm){M.region_mode=rm.dataset.rmode;regionSub();regionRender();updateEdge();window.scrollTo(0,0);return;}
});

// 드로어 본문 위임
el('m-drawer-body').addEventListener('click',function(e){
  // 그룹 아코디언
  var gt=e.target.closest('[data-grptoggle]');
  if(gt){var grp=gt.closest('.d-grp');grp.classList.toggle('open');syncDrawerAccordion();return;}
  // 지역 핀(전속/AM)
  var rp=e.target.closest('[data-rpin]');
  if(rp){e.stopPropagation();var r=rp.dataset.rpin,key=regionPinKey(),pins=loadPins(key);var i=pins.indexOf(r);if(i>=0)pins.splice(i,1);else pins.unshift(r);savePins(key,pins);refreshDrawer();return;}
  // 보상 핀
  var bp=e.target.closest('[data-bspin]');
  if(bp){e.stopPropagation();var r2=bp.dataset.bspin,pins2=loadPins(BS_PIN);var j=pins2.indexOf(r2);if(j>=0)pins2.splice(j,1);else pins2.unshift(r2);savePins(BS_PIN,pins2);refreshDrawer();return;}
  // 선택 항목들
  var it=e.target.closest('.d-item');if(!it)return;
  if(it.dataset.dall){M.dept.grp=null;M.dept.d=null;applyDrawer();}
  else if(it.dataset.dept){M.dept.d=it.dataset.dept;M.dept.grp=dept2grp[it.dataset.dept]||null;applyDrawer();}
  else if(it.dataset.aall){M.area.a=null;M.area.u=null;applyDrawer();}
  else if(it.dataset.area){M.area.a=it.dataset.area;M.area.u=null;applyDrawer();}
  else if(it.dataset.prod){M.area.prod=it.dataset.prod;applyDrawer();}
  else if(it.dataset.region){M.region[M.region_mode]=it.dataset.region;applyDrawer();}
  else if(it.dataset.bsregion){M.bosang.sel=it.dataset.bsregion;M.bosang.q='';applyDrawer();}
});
function refreshDrawer(){var v=VIEWS[M.view];if(!v.drawer)return;var d=v.drawer();el('m-drawer-body').innerHTML=d.body;if(d.after)d.after();}
function applyDrawer(){closeDrawer();VIEWS[M.view].sub();VIEWS[M.view].render();window.scrollTo(0,0);}

// 본문 위임(카드 상호작용)
el('m-content').addEventListener('click',function(e){
  // 섹션 제목 펼치기/접기 (영속 요소에 한 번만 위임 — 렌더마다 리스너 누적 방지)
  var sh=e.target.closest('.map-section-head');if(sh){sh.parentNode.classList.toggle('open');return;}
  // 담당자 정보 펼치기/접기
  var mt=e.target.closest('.mc-toggle');if(mt){var mc=mt.closest('.mc');var open=mc.classList.toggle('open');mt.setAttribute('aria-expanded',open?'true':'false');return;}
  // 복사(레거시, 현재 미사용)
  var cp=e.target.closest('[data-copy]');if(cp){copyText(cp.dataset.copy);return;}
  // 즐겨찾기
  var fav=e.target.closest('.pc-fav');if(fav){var id=fav.dataset.fav;var on=FAV.toggle(id);fav.classList.toggle('on',on);fav.setAttribute('aria-pressed',on?'true':'false');buildNav();
    if(M.view==='favorites'&&!on){var card=fav.closest('.person-card');if(card){card.style.transition='opacity .2s';card.style.opacity='0';setTimeout(favoritesRender,200);}}
    toast(on?'즐겨찾기 추가':'즐겨찾기 해제');return;}
  // 업무분류 칩 → 업무별로 점프
  var fn=e.target.closest('.pc-fn-link');if(fn){var a=fn.dataset.fnArea,u=fn.dataset.fnU;go('area');M.area_panel='work';M.area.a=a||null;M.area.u=u||null;areaSub();areaRender();window.scrollTo(0,0);return;}
  // 대행자 점프
  var jb=e.target.closest('.person-alt-jump');if(jb){jumpToEmp(jb.dataset.jumpEmp);return;}
  // 검색 최근 칩
  var hx=e.target.closest('[data-histx]');if(hx){e.stopPropagation();if(searchHistory.remove)searchHistory.remove(hx.dataset.histx);renderSearchIdle();return;}
  var hc=e.target.closest('[data-hist]');if(hc){var q=hc.dataset.hist;M.search.q=q;var qi=el('m-q');if(qi)qi.value=q;runSearch(q);window.scrollTo(0,0);return;}
  // 업무 u칩(업무별)
  var uc=e.target.closest('[data-u]');if(uc){M.area.u=uc.dataset.u;areaRender();window.scrollTo({top:0});return;}
  var ucl=e.target.closest('[data-uclear]');if(ucl){M.area.u=null;areaRender();window.scrollTo({top:0});return;}
  // 현장소통담당 점프
  var fc=e.target.closest('[data-fcjump]');if(fc){go('area');M.area_panel='work';M.area.a=fc.dataset.fcarea||null;M.area.u=null;areaSub();areaRender();
    setTimeout(function(){var card=document.querySelector('#m-content .person-card[data-emp="'+fc.dataset.fcjump+'"]');if(card){card.scrollIntoView({behavior:'smooth',block:'center'});flashCard(card);}},90);return;}
});

// ── 시작 ──
buildNav();
go('search');
</script>
</body>
